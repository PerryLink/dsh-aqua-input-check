# 水产养殖投入品记录核对 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ⚠️⚠️ 本规则库的诚实说明：**excerpt 一律不是引文。**
#   本插件核对的是"水产养殖投入品（饲料、渔药）使用记录"的**齐备与期限自洽**：
#     塘口与品种是否填写、投入品名称与用量是否填写、使用日期是否可解析、
#     休药期天数是否可解析、起捕日期是否满足"使用日期 + 休药期"、
#     苗种来源与检疫证号是否填写、批次编号是否重复、是否残留模板占位符。
#   其规范载体是**《水产养殖质量安全管理规定》（农业部令第 31 号）**、
#   **NY 5071—2002**《无公害食品 渔用药物使用准则》、**NY 5072—2002**《无公害食品 渔用饲料安全限量》等。
#   ⚠️⚠️ **标准名称与时效性已于 2026-10-07 更正**（见 rules/evidence/clause-verification-standard-currency.md）：
#     经**全国标准信息公共服务平台**与**国家数字标准馆**逐条核实：
#     · **NY/T 755** —— 正确名称是 **《绿色食品 渔药使用准则》**（不是"渔用药物使用准则"）。
#       **现行版本为 `NY/T 755—2022`**（2022-07-11 发布、**2022-10-01 实施**），
#       **全部代替 `NY/T 755—2013`**；`NY/T 755—2013` **已废止**。
#       ⚠️ **注意其适用范围**：该标准属**绿色食品**系列，**其对象是绿色食品生产** ——
#       本插件核对的是**一般水产养殖投入品记录**，故引用它时**不能把它的要求当作所有养殖场的普遍义务**。
#     · **NY 5071—2002** —— 正确名称是 **《无公害食品 渔用药物使用准则》**（"渔用药物"，非"渔药"）。
#       ⚠️ **该标准状态为「废止」，废止日期 2026-01-01** ⇒ **引用它即引用已废止标准**。
#       **本规则库原先两处把它的名称写错，现已更正**；并**如实标注它已废止**。
#     · **NY 5072—2002** —— 名称待核，本轮**未取得其状态**，**不作断言**。
#   ⚠️ **农业部令第 31 号全文已逐字核对**（见 rules/evidence/clause-verification.md），核到
#   第十二条（《水产养殖生产记录》应记载养殖种类、**苗种来源**、饲料来源及投喂情况等，
#   保存至该批水产品全部销售后 2 年以上）、**第十六条**（「**使用药物的养殖水产品在休药期内
#   不得用于人类食品消费**」，且用药应符合 NY5071）、第十八条（《水产养殖用药记录》应记载
#   病害、症状、**用药名称、时间、用量**等内容）。
#   ⚠️ **两个必须写明的限制**：① **该规定的附件 1／附件 3 表格格式未取得**（公报原文标注"(略)"），
#   故**本插件的列名映射是本机构口径，非法定表格**；② **休药期天数在兽药标签与相关标准里，
#   不在本规定里**（本规定只指向 NY5071，而 **NY5071 已废止**）——
#   ⇒ ⚠️ **休药期天数的现行出处本轮未查明，本插件不假定任何来源**。
#   **NY 5071／NY 5072／NY 5361／NY/T 755／GB 13078 本次均未取得逐字条文**，
#   故每条 excerpt 如实写明，kind 降为 derived-from-principle（封顶 warn）。
#
# ⚠️⚠️ 另一条**必须保留的边界**：**本插件绝不判定养殖过程是否合规、
#   水产品是否安全可食、用药是否恰当、是否应当处罚**。
#   那需要结合兽药使用规范、残留检测结果与监管要求判断，是渔业与食品安全监管的职责。
#   → **本插件不内置任何休药期天数**：休药期由兽药产品标签与用药规范规定，
#     台账里的"休药期天数"栏是使用方按实际用药填的，本插件只核对台账自身的时间关系。
#   → **投入品类型清单（inputTypes）与用量单位清单（units）都出厂为空。**

plugin: dsh-aqua-input-check
version: "2026.1"

rules:
  - id: AQ-001
    title: 每条记录都应填写塘口与养殖品种
    severity: warn
    basis:
      document: 《水产养殖质量安全管理规定》
      number: 农业部令（现行令号与条号本次未核实）
      clause: 关于养殖生产记录的条款（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得该文件的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: https://www.gov.cn/
    params:
        check:
          kind: presenceAny
          fields: ["pondNo","species"]
          fix: 补填塘口编号与养殖品种；本条只核对是否填写
    note: >-
      投入品记录若不写明用在哪个塘口、养的是什么品种，事后就无法追溯——
      而追溯正是这套记录存在的理由。本次未取得明文条号，故封顶 warn。
      本条只核对"至少填了一个"，**不判断该投入品是否适用于该品种**。

  - id: AQ-002
    title: 投入品名称与用量都应填写
    severity: warn
    basis:
      document: 《水产养殖质量安全管理规定》
      number: 农业部令（现行令号与条号本次未核实）
      clause: 关于投入品采购与使用记录的条款（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得该文件的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: https://www.gov.cn/
    params:
        check:
          kind: conditionalPresence
          conditionField: inputName
          requiredFields: ["inputQty","usedAt"]
          conditionValues: []
          fix: 补填投入量与使用日期；本条只核对是否记录，不判断用量是否恰当
    note: >-
      写了用了什么却不写用多少、什么时候用，记录就只能说明"用过"，
      无法支撑残留分析与追溯。本次未取得明文条号，故封顶 warn。
      本条**只在投入品名称已填写时**要求投入量与使用日期。
      本条只核对字段是否填写，**不判断用量是否恰当、用药是否对症**。

  - id: AQ-003
    title: 使用日期应可解析且休药期应可解析
    severity: warn
    basis:
      document: 《绿色食品 渔药使用准则》
      number: NY/T 755—2022（2022-07-11 发布、2022-10-01 实施；全部代替已废止的 NY/T 755—2013；属绿色食品系列标准；条号本次未取得）
      clause: 关于用药与休药期的条款（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得该文件的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: https://std.samr.gov.cn/hb/search/stdHBDetailed?id=EC4CA0031C77D5C5E05397BE0A0A70BA
    params:
        check:
          kind: noFutureDate
          field: usedAt
    note: >-
      使用日期可解析是休药期核对的前提；晚于核对日说明日期填错了。
      本次未取得明文条号，故封顶 warn。
      本条识别 2026-03-15 与 2026-03-15 09:30 两种写法；无法解析时会单独报出。
      ⚠️ **本插件不内置任何休药期天数**：休药期由兽药标签与用药规范规定，
      台账里的休药期栏是使用方按实际用药填的。

  - id: AQ-004
    title: 起捕日期应满足休药期要求
    severity: warn
    basis:
      document: 《绿色食品 渔药使用准则》
      number: NY/T 755—2022（2022-07-11 发布、2022-10-01 实施；全部代替已废止的 NY/T 755—2013；属绿色食品系列标准；条号本次未取得）
      clause: 关于休药期与起捕间隔的条款（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得该文件的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: https://std.samr.gov.cn/hb/search/stdHBDetailed?id=EC4CA0031C77D5C5E05397BE0A0A70BA
    params:
        check:
          kind: dateGap
          earlierField: usedAt
          laterField: harvestAt
          minDaysField: withdrawalDays
          fix: 起捕日期应不早于「使用日期 + 休药期天数」；核对三个字段的填写
    note: >-
      "用完药要等够休药期"是**用药记录与起捕记录之间唯一的时间约束**，
      本条按台账自己写的休药期天数核对它。
      依据说明（据农业部令第31号**第十六条**逐字核对）：
      **「使用药物的养殖水产品在休药期内不得用于人类食品消费。」**
      ⚠️ **注意条文的落点是"不得用于人类食品消费"，不是"不得起捕"** ——
      起捕与销售、食用之间还有环节，故本条**只对 warn**，且命中的含义限于
      "**按你填的休药期算，起捕早了 N 天**"，**不表示该批水产品不安全、更不表示违反了第十六条**：
      残留是否超标需要检测结果，本插件看不到。
      ⚠️ **本插件不内置任何休药期天数**，因为**天数在兽药产品标签与相关标准里，不在本规定里**
      （本规定第十六条只指向 **NY 5071—2002《无公害食品 渔用药物使用准则》**，而
      ⚠️ **该标准状态为「废止」，废止日期 2026-01-01** ——
      见 rules/evidence/clause-verification-standard-currency.md）。
      ⇒ ⚠️ **不得再从 NY 5071 引用休药期数值**：该标准已失效，
      而**休药期天数的现行出处本轮未查明** —— 本插件**不假定任何来源**，
      应由使用方查**兽药产品标签**与现行有效标准后填入。
      本条**只在三个字段都有可解析值时**执行；缺任一项即进 skipped ——
      例如只记录投喂、不记录起捕的批次，本条不适用（**不会假定任何天数**）。

  - id: AQ-005
    title: 苗种应记录来源与检疫证号
    severity: warn
    basis:
      document: 《水产养殖质量安全管理规定》
      number: 农业部令（现行令号与条号本次未核实）
      clause: 关于苗种采购与检疫的条款（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得该文件的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: https://www.gov.cn/
    params:
        check:
          kind: conditionalPresence
          conditionField: stockingAt
          requiredFields: ["stockSource","quarantineNo"]
          conditionValues: []
          fix: 补填苗种来源与检疫证号；本条只核对是否记录，不判断检疫证明是否有效
    note: >-
      本条**两个栏位的来源不同，不要一起当成法定要求**（据农业部令第31号逐字核对，
      见 rules/evidence/clause-verification.md）：
      ① **"苗种来源"有明文** —— **第十二条**要求《水产养殖生产记录》记载「养殖种类、
      **苗种来源**及生长情况、饲料来源及投喂情况、水质变化」等内容；
      ② **"检疫证号"不在本规定里** —— 第十条第二款只说「水产养殖使用的苗种应当符合国家或地方质量标准」，
      **未要求记录检疫证明**。该栏属**本机构与地方渔业主管部门的管理口径**，不是规章的明文要求。
      ⚠️ 本规定**附件 1《水产养殖生产记录》表格格式本次未取得**（公报原文标注"(略)"），
      故本插件的列名映射同样是本机构口径，非法定表格。
      本条**只在投苗日期已填写时**要求来源与检疫证号。
      本条只核对字段是否填写，**不判断该检疫证明是否真实有效、是否覆盖该批苗种**。

  - id: AQ-006
    title: 投入品类型应使用本机构口径的取值
    severity: info
    basis:
      document: 本机构养殖生产管理口径（本机构配置）
      number: 无统一标准（本条依据为本机构配置的类型口径）
      clause: 关于投入品分类的条款（本次未取得条号）
      excerpt: 本条依据为本机构配置的口径，不存在可引用的标准条文；本规则库不伪造引文。
      kind: institutional-configuration
      source: https://www.gov.cn/
    params:
        check:
          kind: enum
          field: inputType
          values: []
    note: >-
      values 出厂为空，表示**未配置**，本条进 skipped。
      依据说明：投入品类型的分法（例如「配合饲料」「冰鲜鱼」「水质改良剂」
      「抗菌药」「杀虫药」「消毒剂」「疫苗」）随**本机构生产管理口径**变化，
      本插件**不硬编码任何类型清单**。
      本条只核对所填值是否在册，**不判断该投入品是否属于允许使用的范围**——
      那需要查禁用药品清单与产品批准文号，本插件不做。

  - id: AQ-007
    title: 批次编号不应在台账内重复
    severity: warn
    basis:
      document: 《水产养殖质量安全管理规定》
      number: 农业部令（现行令号与条号本次未核实）
      clause: 关于生产记录的条款（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得该文件的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: https://www.gov.cn/
    params:
        check:
          kind: unique
          field: batchNo
    note: >-
      批次编号唯一是"每批养殖只被登记一次"的**前提条件**：
      编号重复会让投入品用量合计被重复计算，也无法在追溯时准确指认批次。
      本次未取得明文条号，故封顶 warn。比较时忽略空白字符。
      注意：同一批次的多笔投入品记录各占一行是正常的，此时应共用批次编号而**不要**重复使用行号栏。

disabled: []
